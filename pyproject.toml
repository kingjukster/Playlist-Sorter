[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "playlist-sorter"
version = "0.1.0"
description = "Local-first playlist sorting utilities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Playlist Sorter contributors" }]
dependencies = [
  "pydantic==2.12.5",
  "streamlit==1.64.0",
  "typer==0.21.0",
  "psutil==7.2.2",
  "tomli==2.4.0; python_version < '3.11'",
]

[project.scripts]
playlist-sorter = "playlist_sorter.cli:main"

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.14.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_sorter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
