name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check .
      - run: python -m pip install --disable-pip-version-check "pytest==9.0.2" "ruff==0.14.10"
      - run: ruff check .
      - run: pytest
